name: OpenButler CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  butler-core:
    name: Butler Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/app/modules/butler_core/tests
        env:
          PYTHONPATH: backend

  pc-activity:
    name: PC Activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/app/modules/pc_activity_context/tests
        env:
          PYTHONPATH: backend

  workstation-vision:
    name: Workstation Vision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/app/modules/workstation_vision/tests
        env:
          PYTHONPATH: backend

  context-engine:
    name: Context Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run Context Engine and local security tests
        run: python -m unittest discover -s backend/app/modules/context_engine/tests
        env:
          PYTHONPATH: backend
      - name: Run Native Task Activity contracts
        run: python -m unittest discover -s backend/app/modules/task_activity/tests
        env:
          PYTHONPATH: backend
      - name: Run Model Gateway transport and policy tests
        run: python -m unittest discover -s backend/app/modules/model_gateway/tests
        env:
          PYTHONPATH: backend
      - name: Run Local Goal Runtime durability and boundary tests
        run: python -m unittest discover -s backend/app/modules/agent_runtime/tests
        env:
          PYTHONPATH: backend

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:local-proxy
      - run: npm run test:phase1-ui
      - run: npm run test:preview-model-settings
      - run: npm run test:mask-editor
      - run: npm run test:mask-editor-dom
      - run: npm run test:agent-loop
      - run: npm run test:planner-model-settings
      - run: npm run test:natural-chat
      - run: npm run test:task-activity

  desktop-contract:
    name: Desktop Contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: npm run build:frontend
        working-directory: desktop
      - run: node desktop/scripts/check-desktop-contract.mjs
      - run: python desktop/scripts/check-windows-trial-installer-scope.py
      - run: python desktop/scripts/check-windows-trial-installer.py
      - run: node desktop/scripts/check-local-session.cjs
      - run: node desktop/scripts/check-local-session-main.cjs
      - run: node --test desktop/scripts/check-nightly-unpacked.test.mjs
      - run: node desktop/scripts/check-model-routes-persistence.cjs
      - run: node desktop/scripts/check-capture-controller.cjs
      - run: node desktop/scripts/check-desktop-frontend-assets.mjs

  loop-governance:
    name: Loop Governance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/loop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/loop/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run audit:governance -- --no-write

  nightly-controller:
    name: Nightly Controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests
        working-directory: tools/nightly

  merge-authorization:
    name: Merge Authorization
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify current Issue authorization
        env:
          GH_TOKEN: ${{ github.token }}
          OPENBUTLER_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tools/nightly/merge-authorization.mjs verify-pr
